# es-419 overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through es-419, then es, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 41 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.name_is_required = Se requiere el nombre
errors.path_must_be_lowercase_letters_numbers_and_hyphens_1_100_cha = La ruta debe contener letras minúsculas, números y guiones (1-100 caracteres, sin guiones al inicio o al final)
errors.subject_and_permission_are_required = Se requieren sujeto y permiso
errors.cannot_delete_the_default_branch = No se puede eliminar la rama predeterminada
errors.invalid_ref = Ref no válida
errors.remote_request_failed = El servidor remoto no pudo completar la solicitud
errors.not_logged_in = Sesión no iniciada
errors.token_name_is_too_long_max_100_characters = Nombre del token demasiado largo (máx. 100 caracteres)
errors.no_url_provided = No se proporcionó una URL
errors.invalid_repository_id_or_fingerprint_in_url = ID de repositorio o huella digital no válidos en la URL
errors.unable_to_connect_to_server = No se puede conectar al servidor
errors.already_subscribed_to_this_repository = Ya está suscrito a este repositorio
errors.unable_to_find_repository_in_directory_please_provide_the_re = No se puede encontrar el repositorio en el directorio. Proporcione la URL del repositorio.
errors.file_not_found = Archivo '{path}' no encontrado.
errors.too_many_requests = Demasiadas solicitudes. Inténtelo de nuevo más tarde.
